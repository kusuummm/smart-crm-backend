name: Secret Scanning & Credentials Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    name: Scan for Hardcoded Credentials & Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Antigravity Secret Scanner
        run: node utils/secretScanner.js --all

      - name: Verify Git Ignore Coverage
        run: |
          if git ls-files | grep -E '^\.env$|\.env\.local$|\.pem$|\.key$|credentials\.json'; then
            echo "CRITICAL: Sensitive environment or credential files detected in git tracking!"
            exit 1
          else
            echo "Git ignore rules verified: no tracked credentials."
          fi
