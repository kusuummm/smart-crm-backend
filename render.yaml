services:
  - type: web
    name: smart-crm-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: WHATSAPP_API_URL
        value: https://graph.facebook.com/v23.0
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: WHATSAPP_APP_ID
        value: "1294427618873067"
      - key: WHATSAPP_WABA_ID
        value: "1604281820561116"
      - key: WHATSAPP_PHONE_NUMBER_ID
        value: "1408768628982301"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: peyug_crm_webhook_verify_sec_948f21
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SECURE
        value: "false"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: "PeYug CRM <support@peyug.com>"
